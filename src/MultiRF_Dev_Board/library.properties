sentence=Pin map, helpers and examples for the Elektor MultiRF Dev Board (ESP32-S3 with CC1101, nRF24L01P, E77-900M22S LoRaWAN and EWM108-GN05 GNSS).
paragraph=Companion library to the Elektor Wireless Workshop series. Includes an AT command helper for the Ebyte E77-900M22S LoRaWAN module, an Allystar binary protocol helper for the Ebyte EWM108-GN05 GNSS receiver, and examples per module, from a serial bridge to a LoRaWAN GPS tracker on The Things Network.
